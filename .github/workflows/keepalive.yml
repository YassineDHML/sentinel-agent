name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 05:00 UTC. The Supabase free tier pauses a project after
    # 7 idle days; a SELECT 1 every 3 days keeps it awake with margin to spare.
    - cron: "0 5 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sentinel-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        # Keep-alive only needs the DB client + config loading, not the whole
        # pipeline — install just those, then the package without its deps.
        run: |
          python -m pip install --upgrade pip
          pip install supabase==2.31.0 PyYAML==6.0.2 python-dotenv==1.0.1
          pip install -e . --no-deps

      - name: Ping Supabase (SELECT 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m sentinel.db.keepalive
