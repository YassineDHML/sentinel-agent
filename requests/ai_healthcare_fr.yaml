# Demonstration profile: a completely different theme, language and geography from
# the production weekly watch — the proof that the pipeline is parameterized.
#
# Run it with:
#   python -m sentinel.pipeline --dry-run --profile requests/ai_healthcare_fr.yaml

slug: ai_healthcare_fr
report_type: deep_research

# {A} theme — arbitrary free text, nothing about it is hardcoded anywhere
theme: L'intelligence artificielle dans le secteur de la santé

# {B} report language
language: fr

# {C} geographic zone — drives source language/region parameters
geo_zone: france

# {D} time horizon: 12 months back, 3-5 year projection
horizon:
  past_months: 12
  future_years: 5

# {E} sector focus
sector: santé

# {F} the executive's priority objective
objective: growth

# Cadence + scheduling: the daily dispatcher produces this once per calendar
# month (see `python -m sentinel.schedule --dry-run`). Set `scheduled: false` to
# park the request without deleting it — it stays runnable by hand with
#     python -m sentinel.research --profile requests/ai_healthcare_fr.yaml
cadence: monthly
scheduled: true

# Recipients omitted on purpose: falls back to profiles/onboarding.yaml, then to
# config.yaml's report.recipients.
subject_prefix: Sentinel · IA & Santé

word_target: 3000
word_tolerance: 250

# Discovery queries for this theme (replaces config.yaml's AI-vendor queries)
discovery_queries:
  - "intelligence artificielle santé"
  - "IA diagnostic médical"
  - "AI healthcare regulation Europe"
  - "hôpital intelligence artificielle"
  - "medical imaging AI"
  - "santé numérique investissement"

# Relevance vocabulary for this theme
relevance_keywords:
  - intelligence artificielle
  - IA
  - AI
  - santé
  - médical
  - hôpital
  - diagnostic
  - imagerie
  - patient
  - healthcare
  - clinical
  - biotech
relevance_exclude:
  - horoscope
  - crypto

# Named research houses whose published work should be sought for benchmarks.
#
# ⚠ NOT WIRED UP. This key is parsed and validated onto RequestProfile, but no code
# reads it — editing this list changes nothing. The houses actually prioritised are
# hardcoded in ACQUIRE_INSTRUCTIONS (research/prompts.py): McKinsey, BCG, Bain,
# Deloitte, PwC, Gartner, Forrester, IDC. Kept because the field is the right shape
# for the feature; make the prompt read it before treating it as configuration.
benchmark_houses:
  - McKinsey
  - BCG
  - Deloitte
  - Gartner
  - IDC
  - OCDE

# NOTE: `topics` is intentionally NOT overridden — but the old reason no longer
# applies. Trends are namespaced per request now (UNIQUE(request_slug, week, topic)),
# so a custom taxonomy is perfectly safe in this request's own scope, which is the
# default. It would only be refused if this file also set `trend_scope` to a scope it
# does not own. This request simply has no need to depart from the canonical list.
#
# This request is `report_type: deep_research`, and the deep-research engine does not
# run the collectors at all — so `topics`, `feeds`, `discovery_queries` and the
# relevance keys above are inert for it. They apply when a profile drives the weekly
# watch. Kept here because they document the theme and cost nothing.
