# The historical weekly watch, expressed as a request profile.
#
# This reproduces what the pipeline has always done, so it doubles as the reference
# example. It deliberately overrides NOTHING that config.yaml already defines —
# running the pipeline with this profile is equivalent to running it without one,
# apart from carrying the {A}..{F} metadata.

slug: weekly_ai_saas
report_type: weekly_watch

# {A} theme
theme: AI SaaS B2B — tooling, models and agent platforms

# {B} language (sources stay English; this is the report narrative language)
language: en

# {C} geographic zone
geo_zone: world

# {D} time horizon
horizon:
  past_months: 12
  future_years: 3

# {E} sector focus — none: this watch is the AI-tooling market itself
sector: null

# {F} priority objective
objective: innovation

cadence: weekly

# Trends are namespaced per request, and a request defaults to its OWN history.
# This one must not: it *is* the production weekly watch, so it has to read and
# write the same trend history the unprofiled pipeline has always used. Without
# this line, running the watch with --profile would silently start a second,
# empty history and every topic would look NEW. A test pins it.
trend_scope: __default__

# NOT dispatched by `python -m sentinel.schedule`. The production weekly watch is
# owned by .github/workflows/weekly.yml, which runs the pipeline directly every
# Monday. Two owners would mean two Monday emails, so the scheduler leaves this
# request alone. It stays runnable by hand:
#     python -m sentinel.pipeline --profile requests/weekly_ai_saas.yaml
# A test pins this to false — flipping it is a deliberate migration, not a tweak.
scheduled: false

# Recipients / keywords / topics / feeds intentionally omitted:
# config.yaml remains the source of truth for the production weekly watch.
