[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.0.0"
description = "Automated strategic-intelligence pipeline for the AI SaaS B2B sector"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (the source of truth for
# reproducible installs). They are intentionally NOT declared here so that
# `pip install -e .` only puts the `sentinel` package on the import path and
# stays lightweight — install deps separately with `pip install -r requirements.txt`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ layout: make `sentinel` importable in tests without setting PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]
